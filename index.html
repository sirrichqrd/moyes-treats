<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moye's Treats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" type="image/svg" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="shortcut icon" type="image/svg" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a2c6a">
  <script src="https://unpkg.com/lucide@latest"></script>
<style>
    :root {
      --primary: #4a2c6a;
      --primary-light: #7c5c9c;
      --primary-dark: #3a1c5a;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --bg: #f3e8ff;
      --bg-card: #ffffff;
      --border: #e9d5ff;
      --success: #10b981;
      --danger: #ef4444;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .font-pacifico { font-family: 'Pacifico', cursive; }
    .font-poppins { font-family: 'Poppins', sans-serif; }

    .bg-shape {
      position: fixed; border-radius: 50%; opacity: 0.12; z-index: 0; pointer-events: none;
    }
    .bg-shape-1 { width: 300px; height: 300px; background: var(--primary); top: -80px; right: -60px; }
    .bg-shape-2 { width: 220px; height: 220px; background: var(--accent); bottom: 80px; left: -60px; }
    .bg-shape-3 { width: 160px; height: 160px; background: var(--primary-light); top: 45%; right: 8%; }

    /* === CART BAR === */
    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.12); padding: 12px 16px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-bar.active { transform: translateY(0); }
    @media (max-width: 640px) {
      .cart-bar { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
      .cart-bar > div:first-child { min-width: 0; flex: 1 1 auto; }
      .cart-bar .text-xl { font-size: 1.1rem; }
      .cart-bar button { padding: 10px 14px; font-size: 0.8rem; border-radius: 10px; white-space: nowrap; }
    }

    /* === MODALS === */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(31, 31, 46, 0.55);
      backdrop-filter: blur(10px); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: white; border-radius: 24px; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 25px 80px rgba(0,0,0,0.2);
      transform: scale(0.92) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.25rem; font-weight: 700; color: var(--primary-dark); font-family: 'Poppins', sans-serif; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg);
      color: var(--primary-dark); font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.25s;
    }
    .modal-close:hover { background: var(--border); transform: rotate(90deg); }
    .modal-body { padding: 16px 24px 24px; }
    @media (max-width: 640px) {
      .modal-overlay { padding: 8px; align-items: flex-end; }
      .modal { border-radius: 20px 20px 0 0; max-height: 92vh; }
      .modal-header { padding: 16px 16px 0; }
      .modal-title { font-size: 1.1rem; }
      .modal-body { padding: 14px 16px 20px; }
      .modal .grid.grid-cols-2 { grid-template-columns: 1fr; }
      .modal .grid.grid-cols-2.gap-4 > div { margin-bottom: 0; }
    }

    .toast {
      position: fixed; top: 20px; right: 20px; background: white; padding: 14px 22px;
      border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 12px; z-index: 300;
      transform: translateX(150%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      border-left: 4px solid var(--success);
    }
    .toast.active { transform: translateX(0); }
    .toast-icon {
      width: 28px; height: 28px; background: var(--success); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0; font-size: 0.9rem;
    }
    @media (max-width: 640px) {
      .toast { left: 16px; right: 16px; top: 12px; transform: translateY(-150%); }
      .toast.active { transform: translateY(0); }
    }

    .combo-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FAF5FF 100%);
      border: 2px solid var(--border); border-radius: 18px; padding: 22px;
      position: relative; transition: all 0.3s ease;
    }
    .combo-card:hover { border-color: var(--primary-light); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(91,46,145,0.1); }
    .combo-card.best-value {
      border-color: var(--accent);
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFBEB 100%);
    }
    .best-value-badge {
      position: absolute; top: -11px; right: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      padding: 5px 14px; border-radius: 20px; box-shadow: 0 4px 12px rgba(245,158,11,0.3); letter-spacing: 1px;
    }
    .item-qty {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; border-radius: 50%; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
    }

    .builder-card {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white; border: none; position: sticky; top: 80px;
    }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.15); color: white; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-weight: 600;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.28); }

    .delivery-option {
      flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .delivery-option.active {
      border-color: var(--primary); background: rgba(91,46,145,0.05);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px;
      font-family: 'Poppins', sans-serif; font-size: 0.95rem; transition: all 0.3s; background: white;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(124,79,184,0.1);
    }
    .form-textarea { resize: vertical; min-height: 80px; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .heart-anim { display: inline-block; animation: heartbeat 1.5s ease infinite; }

    .gal-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.85); border-radius: 9999px; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-weight: bold; transition: all 0.2s; border: none; cursor: pointer;
    }
    .gal-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

    .fee-line {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 0.9rem; color: #555;
    }
    .fee-line.total {
      border-top: 2px solid var(--primary-dark);
      padding-top: 10px; margin-top: 6px;
      font-weight: 700; color: var(--primary-dark); font-size: 1.05rem;
    }
    
    /* === PREMIUM ANIMATIONS & UTILITIES === */
    .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.active { opacity: 1; transform: translateY(0); }
    .stagger-1 { transition-delay: 0.1s; }
    .stagger-2 { transition-delay: 0.2s; }
    .stagger-3 { transition-delay: 0.3s; }
    .stagger-4 { transition-delay: 0.4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }

    .hero-section {
      position: relative; min-height: 90vh; display: flex; align-items: center;
      background: linear-gradient(135deg, #2d1b4e 0%, #4a2c6a 50%, #3a1c5a 100%);
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; opacity: 0.25;
      background-image: url('https://images.unsplash.com/photo-1488477181946-6428a0291777?w=1200&q=80');
      background-size: cover; background-position: center;
    }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(45,27,78,0.8), rgba(74,44,106,0.9)); }

    .trust-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15); padding: 8px 16px;
      border-radius: 999px; color: white; font-size: 0.85rem; font-weight: 500;
    }

    .section-label {
      display: inline-block; background: rgba(74,44,106,0.08);
      color: #4a2c6a; padding: 6px 18px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em;
      margin-bottom: 1rem; border: 1px solid rgba(74,44,106,0.12);
    }

    .product-card-premium {
      background: white; border-radius: 24px; overflow: hidden;
      border: 1px solid #e9d5ff; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(74,44,106,0.06);
    }
    .product-card-premium:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(74,44,106,0.12);
      border-color: #d8b4fe;
    }

    .why-card {
      background: white; border-radius: 20px; padding: 28px;
      border: 1px solid #e9d5ff; transition: all 0.3s ease;
    }
    .why-card:hover { border-color: #f59e0b; transform: translateY(-4px); box-shadow: 0 12px 30px rgba(91,46,145,0.08); }

    .review-card {
      background: white; border-radius: 20px; padding: 24px;
      border: 1px solid #e9d5ff; box-shadow: 0 4px 20px rgba(74,44,106,0.04);
    }

    .cta-section {
      background: linear-gradient(135deg, #4a2c6a 0%, #3a1c5a 100%);
      position: relative; overflow: hidden;
    }
    .cta-section::before {
      content: ''; position: absolute; top: -50%; right: -10%;
      width: 400px; height: 400px; background: rgba(245,158,11,0.08);
      border-radius: 50%; filter: blur(60px);
    }

    .site-footer {
      background: #2d1b4e; color: #c4b5e0;
      padding: 60px 20px 30px;
    }
    .footer-brand { font-family: 'Pacifico', cursive; color: white; font-size: 1.5rem; }
    .footer-link { color: #a78bfa; transition: color 0.2s; background: none; border: none; cursor: pointer; font-size: 0.875rem; }
    .footer-link:hover { color: #fbbf24; }

    .star-filled { color: black; }
    .star-empty { color: #e9d5ff; }

    html { scroll-behavior: smooth; }

    /* === LIGHTBOX === */
    .lightbox-overlay {
      position: fixed; inset: 0; z-index: 400;
      background: rgba(10, 5, 20, 0.92);
      backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    .lightbox-overlay.active { opacity: 1; pointer-events: all; }
    .lightbox-content {
      position: relative; max-width: 95vw; max-height: 90vh;
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-content img {
      max-width: 100%; max-height: 90vh; object-fit: contain;
      border-radius: 12px; box-shadow: 0 25px 80px rgba(0,0,0,0.5);
      transition: transform 0.3s ease; transform-origin: center;
      cursor: grab; -webkit-user-drag: none;
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 24px; z-index: 10;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; font-size: 1.8rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px);
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); transform: rotate(90deg); }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px);
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }
    .lightbox-counter {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.1); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15); color: white;
      padding: 6px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 500;
    }
    @media (max-width: 640px) {
      .lightbox-nav { width: 40px; height: 40px; font-size: 1.2rem; }
      .lightbox-prev { left: 8px; }
      .lightbox-next { right: 8px; }
      .lightbox-close { top: 12px; right: 12px; width: 40px; height: 40px; }
    }

    /* === NAVBAR ICON ANIMATION === */
    .nav-icon-anim {
      display: inline-block;
      animation: navIconSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes navIconSlide {
      from { opacity: 0; transform: translateX(-10px) scale(0.8); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* === RESPONSIVE NAVBAR === */
    .nav-desktop { display: flex; }
    .nav-mobile { display: none; }
    @media (max-width: 768px) {
      .nav-desktop { display: none !important; }
      .nav-mobile { display: flex !important; }
    }

    /* === MOBILE SIDEBAR === */
    .mobile-sidebar {
      position: fixed; inset: 0; z-index: 250;
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s ease;
    }
    .mobile-sidebar.active { pointer-events: all; opacity: 1; }
    .mobile-sidebar-bg {
      position: absolute; inset: 0; background: rgba(31,31,46,0.5);
      backdrop-filter: blur(4px);
    }
    .mobile-sidebar-panel {
      position: absolute; top: 0; left: 0; bottom: 0; width: 280px;
      background: white; transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column;
      box-shadow: 10px 0 40px rgba(0,0,0,0.15);
    }
    .mobile-sidebar.active .mobile-sidebar-panel { transform: translateX(0); }
    .mobile-sidebar-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .mobile-sidebar-close {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--bg); color: var(--primary-dark); font-size: 1.3rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .mobile-sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }
    .mobile-sidebar-item {
      width: 100%; text-align: left; padding: 14px 16px;
      border-radius: 14px; display: flex; align-items: center; gap: 14px;
      font-size: 1rem; font-weight: 500; color: var(--primary-dark);
      background: none; border: none; cursor: pointer; transition: all 0.2s;
      margin-bottom: 4px;
    }
    .mobile-sidebar-item:hover, .mobile-sidebar-item.active {
      background: var(--bg);
    }
    .mobile-sidebar-item.active { color: var(--primary); font-weight: 700; }
    .mobile-sidebar-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .mobile-sidebar-item.active .mobile-sidebar-icon {
      background: var(--primary); color: white;
    }
    .mobile-sidebar-footer {
      padding: 16px; border-top: 1px solid var(--border);
      text-align: center; font-size: 0.8rem; color: #999;
    }

    /* Prevent body scroll when sidebar/modal is open */
    body.sidebar-open { overflow: hidden; }

/* ===================== PWA INSTALL BUTTON ===================== */

.pwa-install-button {
  position: fixed;
  right: 20px;
  bottom: 24px;
  z-index: 150;
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 15px 10px 10px;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 26px;
  background: rgba(74,44,106,0.95);
  color: white;
  box-shadow: 0 12px 35px rgba(45,27,78,0.3);
  backdrop-filter: blur(14px);
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  font-family: 'Poppins', sans-serif;
}

.pwa-install-button.show {
  display: flex;
  animation: installButtonIn 0.5s ease both;
}

.pwa-install-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 40px rgba(45,27,78,0.4);
}

.pwa-install-icon {
  width: 36px;
  height: 36px;
  border-radius: 18px;
  background: #f59e0b;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.pwa-install-button strong {
  display: block;
  font-size: 0.8rem;
  text-align: left;
}

.pwa-install-button small {
  display: block;
  font-size: 0.65rem;
  color: #d8c8ea;
  text-align: left;
  margin-top: 1px;
}

@keyframes installButtonIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 640px) {
  .pwa-install-button {
    right: 14px;
    bottom: 78px;
    padding: 9px 13px 9px 9px;
  }
}

/* ===================== PWA UPDATE NOTICE ===================== */

#moyesUpdateNotice {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 20px;
  z-index: 500;
  max-width: 520px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: white;
  border: 1px solid #e9d5ff;
  border-radius: 18px;
  box-shadow: 0 20px 60px rgba(45,27,78,0.22);
  animation: updateNoticeIn 0.45s ease both;
  font-family: 'Poppins', sans-serif;
}

.pwa-update-icon {
  width: 40px;
  height: 40px;
  flex-shrink: 0;
  border-radius: 12px;
  background: #f3e8ff;
  color: #4a2c6a;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pwa-update-text {
  flex: 1;
  min-width: 0;
}

.pwa-update-text strong {
  display: block;
  color: #3a1c5a;
  font-size: 0.8rem;
}

.pwa-update-text span {
  display: block;
  color: #7c5c9c;
  font-size: 0.68rem;
  margin-top: 2px;
}

#moyesUpdateNotice > button:not(.pwa-update-close) {
  border: none;
  border-radius: 10px;
  padding: 9px 14px;
  background: #4a2c6a;
  color: white;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease;
}

#moyesUpdateNotice > button:not(.pwa-update-close):hover {
  background: #3a1c5a;
  transform: translateY(-1px);
}

.pwa-update-close {
  border: none;
  background: transparent;
  color: #9ca3af;
  font-size: 1.3rem;
  cursor: pointer;
  padding: 4px;
}

@keyframes updateNoticeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 640px) {
  #moyesUpdateNotice {
    bottom: 12px;
    left: 12px;
    right: 12px;
  }
}
</style>

</head>
<body class="bg-[#f3e8ff] min-h-screen">

<div class="bg-shape bg-shape-1"></div>
<div class="bg-shape bg-shape-2"></div>
<div class="bg-shape bg-shape-3"></div>

<div id="app"></div>

<!-- PWA Install Button -->
<button id="installAppButton"
        class="pwa-install-button"

function initScrollReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('active');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

let lightboxCategory = null;

function openLightbox(categoryId, imageIndex) {
  lightboxCategory = categoryId;
  lightboxIndex = imageIndex;
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
  updateLightbox();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
  document.getElementById('lightboxImg').style.transform = 'scale(1)';
}

function closeLightboxOnBackground(e) {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
}

function updateLightbox() {
  const cat = products[lightboxCategory];
  if (!cat) return;
  document.getElementById('lightboxImg').src = cat.images[lightboxIndex];
  document.getElementById('lightboxCounter').textContent = `${lightboxIndex + 1} / ${cat.images.length}`;
}

function lightboxPrev() {
  const cat = products[lightboxCategory];
  if (!cat) return;
  lightboxIndex = (lightboxIndex - 1 + cat.images.length) % cat.images.length;
  updateLightbox();
}

function lightboxNext() {
  const cat = products[lightboxCategory];
  if (!cat) return;
  lightboxIndex = (lightboxIndex + 1) % cat.images.length;
  updateLightbox();
}

// Keyboard support
document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb || !lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxPrev();
  if (e.key === 'ArrowRight') lightboxNext();
});

// ===================== UTILS =====================
function formatPrice(n) {
  return '₦' + n.toLocaleString('en-NG');
}
function getCartTotal() {
  return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
}
function getCartCount() {
  return cart.reduce((sum, item) => sum + item.qty, 0);
}
function getCustomSubtotal() {
  return cart
    .filter(item => item.type === 'custom')
    .reduce((sum, item) => sum + (item.price * item.qty), 0);
}
function getPackagingFee() {
  const customTotal = getCustomSubtotal();
  if (customTotal === 0) return 0;
  if (customTotal >= 1000 && customTotal <= 4999) return 600;
  if (customTotal >= 5000 && customTotal <= 9999) return 1000;
  if (customTotal >= 10000 && customTotal <= 14999) return 1200;
  if (customTotal >= 15000 && customTotal <= 20000) return 1500;
  if (customTotal > 20000 && customTotal <= 30000) return 2500;
  if (customTotal > 30000) return 2500;
  return 0;
}
function getDeliveryFee() {
  if (deliveryMethod !== 'delivery' || !selectedLocation) return 0;
  return deliveryFees[selectedLocation] || 0;
}
function getSubtotal() {
  return getCartTotal();
}
function getGrandTotal() {
  return getSubtotal() + getPackagingFee() + getDeliveryFee();
}
function hasCustomPackage() {
  return cart.some(item => item.type === 'custom');
}

// ===================== CART ACTIONS =====================
function addMenuItem(productId, itemName, price) {
  const existing = cart.find(i => i.type === 'menu' && i.productId === productId && i.itemName === itemName);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: String(Date.now() + Math.random()), type: 'menu', productId, itemName, price, qty: 1 });
  }
  updateCartUI();
  showToast('Added to Cart!', `${products[productId].name} — ${itemName}`);
}

function addCombo(name, price, items) {
  const existing = cart.find(i => i.type === 'combo' && i.name === name);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: String(Date.now() + Math.random()), type: 'combo', name, price, items, qty: 1 });
  }
  updateCartUI();
  showToast('Combo Added!', `${name} added to your order.`);
}

function addCustomToCart() {
  const hasItems = Object.values(customQty).some(q => q > 0);
  if (!hasItems) {
    showToast('Empty Package', 'Please select at least one item.', true);
    return;
  }
  let total = 0;
  let items = {};
  for (let [item, qty] of Object.entries(customQty)) {
    if (qty > 0) {
      items[item] = qty;
      total += qty * smallChopsPrices[item];
    }
  }
  cart.push({ id: String(Date.now() + Math.random()), type: 'custom', name: 'Custom Package', price: total, items, qty: 1 });
  for (let item in customQty) { customQty[item] = 0; }
  updateCartUI();
  showToast('Custom Package Added!', 'Your custom selection has been added.');
}

function updateCartQty(cartId, delta) {
  const item = cart.find(i => i.id === cartId);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== cartId);
  }
  updateCartUI();
  renderCartModal();
  renderCheckoutSummary();
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.id !== cartId);
  updateCartUI();

// ===================== TOAST =====================
function showToast(title, message, isError = false) {
  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMessage').textContent = message;
  const icon = document.getElementById('toastIcon');
  icon.textContent = isError ? '!' : '✓';
  icon.style.background = isError ? 'var(--danger)' : 'var(--success)';
  toast.style.borderLeftColor = isError ? 'var(--danger)' : 'var(--success)';
  toast.classList.add('active');
  setTimeout(() => toast.classList.remove('active'), 2800);
}

function renderCheckoutSummary() {

  const grandTotal = getGrandTotal();

  let html = '<div class="font-bold text-[#4a2c6a] mb-3 text-sm">Order Summary</div>';

  cart.forEach(item => {
    let name = item.type === 'menu' ? `${products[item.productId].name} — ${item.itemName}` : item.name;

  html += `<div class="fee-line"><span>Subtotal</span><span class="font-semibold text-[#4a2c6a]">${formatPrice(subtotal)}</span></div>`;

function selectDelivery(el, method) {
  deliveryMethod = method;
  selectedLocation = '';
  document.querySelectorAll('.delivery-option').forEach(opt => opt.classList.remove('active'));
  el.classList.add('active');

  const locationGroup = document.getElementById('deliveryLocationGroup');
  const addressGroup = document.getElementById('addressGroup');
  const feeDisplay = document.getElementById('deliveryFeeDisplay');
  const locationSelect = document.getElementById('deliveryLocation');

  if (method === 'delivery') {
    locationGroup.style.display = 'block';
    addressGroup.style.display = 'block';
  } else {
    locationGroup.style.display = 'none';
    addressGroup.style.display = 'none';
    feeDisplay.style.display = 'none';
    if (locationSelect) locationSelect.value = '';
  }
  renderCheckoutSummary();
}

function onLocationChange(select) {
  selectedLocation = select.value;
  const feeDisplay = document.getElementById('deliveryFeeDisplay');
  if (selectedLocation && deliveryFees[selectedLocation]) {
    feeDisplay.textContent = `Delivery Fee: ${formatPrice(deliveryFees[selectedLocation])}`;
    feeDisplay.style.display = 'block';
  } else {
    feeDisplay.style.display = 'none';
  }
  renderCheckoutSummary();
}

function submitOrder(e) {
  e.preventDefault();
  if (cart.length === 0) {
    showToast('Empty Cart', 'Please add items to your order first.', true);
    return;
  }

  const form = e.target;
  const firstName = form.firstName.value;
  const lastName = form.lastName.value;
  const phone = form.phone.value;
  const houseNumber = form.houseNumber.value;
  const street = form.street.value;
  const landmark = form.landmark.value;
  const notes = form.notes.value;

  // Save customer details to localStorage
  savedCustomer = { firstName, lastName, phone, houseNumber, street, landmark, notes };
  try {
    localStorage.setItem('moyesCustomer', JSON.stringify(savedCustomer));
  } catch(err) {}

  const subtotal = getSubtotal();
  const packagingFee = getPackagingFee();
  const deliveryFee = getDeliveryFee();
  const grandTotal = getGrandTotal();

  let msg = `*NEW ORDER — Moye's Treats*%0A%0A`;
  msg += `*Customer:* ${firstName} ${lastName}%0A`;
  msg += `*Phone:* ${phone}%0A`;
  msg += `*Delivery:* ${deliveryMethod === 'pickup' ? 'Pickup' : 'Delivery'}%0A`;
  if (deliveryMethod === 'delivery') {
    if (selectedLocation) msg += `*Location:* ${selectedLocation}%0A`;
    if (houseNumber) msg += `*House Number:* ${houseNumber}%0A`;
    if (street) msg += `*Street:* ${street}%0A`;
    if (landmark) msg += `*Nearest Landmark:* ${landmark}%0A`;
  }
  if (notes) msg += `*Notes:* ${notes}%0A`;
  msg += `%0A*ORDER ITEMS:*%0A`;

  cart.forEach((item, i) => {
    let line = '';
    if (item.type === 'menu') {
      line = `${products[item.productId].name} — ${item.itemName}`;
    } else if (item.type === 'combo') {
      line = `${item.name} (${Object.entries(item.items).map(([n,q])=>`${q} ${n}`).join(', ')})`;
    } else {
      line = `${item.name} (${Object.entries(item.items).map(([n,q])=>`${q}× ${n}`).join(', ')})`;
    }
    msg += `${i+1}. ${line} ×${item.qty} — ${formatPrice(item.price * item.qty)}%0A`;
  });

  msg += `%0A*ORDER TOTAL:*%0A`;
  msg += `Subtotal: ${formatPrice(subtotal)}%0A`;
  if (packagingFee > 0) msg += `Packaging Fee: ${formatPrice(packagingFee)}%0A`;
  if (deliveryFee > 0) msg += `Delivery Fee: ${formatPrice(deliveryFee)}%0A`;
  msg += `*GRAND TOTAL: ${formatPrice(grandTotal)}*`;

  const whatsappUrl = `https://wa.me/234${contact.phone}?text=${msg}`;
  window.open(whatsappUrl, '_blank');
  showToast('Order Ready!', 'Redirecting you to WhatsApp...');

  // == RESET EVERYTHING TO DEFAULT ==
  cart = [];
  for (let item in customQty) { customQty[item] = 0;}
  deliveryMethod = 'pickup';
  selectedLocation = '';

  // Reset checkout modal UI for next time
  const deliveryOptions = document.querySelectorAll('.delivery-option');
  if (deliveryOptions[0]) deliveryOptions[0].classList.add('active');
  if (deliveryOptions[1]) deliveryOptions[1].classList.remove('active');
  document.getElementById('deliveryLocationGroup').style.display = 'none';
  document.getElementById('addressGroup').style.display = 'none';
  document.getElementById('deliveryFeeDisplay').style.display = 'none';
  document.getElementById('deliveryLocation').value = '';

  updateCartUI();
  closeCheckoutModal();
  setPage('home');
}

document.addEventListener('DOMContentLoaded', function() {
  render();

    // Close sidebar on escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMobileSidebar();
  });

  // Lightbox swipe & pinch-to-zoom
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  if (lb && img) {
    let pinchStartDist = 0;
    let currentScale = 1;

    lb.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
      } else if (e.touches.length === 2) {
        pinchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    lb.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = Math.min(Math.max((dist / pinchStartDist) * currentScale, 1), 3);
        img.style.transform = `scale(${scale})`;
      }
    }, { passive: false });

    lb.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1 && touchStartX && e.touches.length === 0) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(diffX) > 50) {
          diffX > 0 ? lightboxPrev() : lightboxNext();
        }
        touchStartX = 0;
      }
      if (e.touches.length === 0) {
        currentScale = 1;
        img.style.transform = 'scale(1)';
      } else if (e.touches.length === 1) {
        const match = img.style.transform.match(/scale\(([\d.]+)\)/);
        if (match) currentScale = parseFloat(match[1]);
      }
    });
  }
});
// ===================== PWA MANAGEMENT =====================

let deferredInstallPrompt = null;
let moyesUpdateRegistration = null;

// ---------- INSTALL PROMPT ----------

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();

  deferredInstallPrompt = event;

  const installButton = document.getElementById('installAppButton');

  if (installButton && !isMoyesAppInstalled()) {
    installButton.classList.add('show');

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  }
});

async function installMoyesApp() {
  if (!deferredInstallPrompt) {
    return;
  }

  deferredInstallPrompt.prompt();

  const { outcome } = await deferredInstallPrompt.userChoice;

  if (outcome === 'accepted') {
    console.log("Moye's Treats app installation accepted.");
  } else {
    console.log("Moye's Treats app installation dismissed.");
  }

  deferredInstallPrompt = null;

  const installButton = document.getElementById('installAppButton');

  if (installButton) {
    installButton.classList.remove('show');
  }
}

function isMoyesAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true;
}

// ---------- APP INSTALLED ----------

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;

  const installButton = document.getElementById('installAppButton');

  if (installButton) {
    installButton.classList.remove('show');
  }

  console.log("Moye's Treats has been installed.");
});

// ---------- SERVICE WORKER ----------

if ('serviceWorker' in navigator) {

  window.addEventListener('load', async () => {

    try {

      const registration =
        await navigator.serviceWorker.register('/sw.js');

      moyesUpdateRegistration = registration;

      console.log(
        "Moye's Treats service worker registered:",
        registration.scope
      );

      // Check for a new version
      registration.update();

      if (registration.waiting) {
        showMoyesUpdateNotice(registration);
      }

      registration.addEventListener('updatefound', () => {

        const newWorker = registration.installing;

        if (!newWorker) return;

        newWorker.addEventListener('statechange', () => {

          if (
            newWorker.state === 'installed' &&
            navigator.serviceWorker.controller
          ) {
            showMoyesUpdateNotice(registration);
          }

        });

      });

    } catch (error) {

      console.error(
        "Moye's Treats service worker registration failed:",
        error
      );

    }

  });

}

// ---------- UPDATE NOTICE ----------

function showMoyesUpdateNotice(registration) {

  if (document.getElementById('moyesUpdateNotice')) {
    return;
  }

  const notice = document.createElement('div');

  notice.id = 'moyesUpdateNotice';

  notice.innerHTML = `
    <div class="pwa-update-icon">
      <i data-lucide="refresh-cw" class="w-5 h-5"></i>
    </div>

    <div class="pwa-update-text">
      <strong>New version available</strong>
      <span>Moye's Treats has been updated.</span>
    </div>

    <button onclick="updateMoyesApp()">
      Update
    </button>

    <button class="pwa-update-close"
            onclick="dismissMoyesUpdate()"
            aria-label="Dismiss update">
      ×
    </button>
  `;

  document.body.appendChild(notice);

  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
}

function updateMoyesApp() {

  if (!moyesUpdateRegistration ||
      !moyesUpdateRegistration.waiting) {
    return;
  }

  moyesUpdateRegistration.waiting.postMessage({
    type: 'SKIP_WAITING'
  });
}

function dismissMoyesUpdate() {

  const notice =
    document.getElementById('moyesUpdateNotice');

  if (notice) {
    notice.remove();
  }
}

// Reload once the new service worker takes control
navigator.serviceWorker?.addEventListener('controllerchange', () => {

  if (window.__moyesRefreshing) {
    return;
  }

  window.__moyesRefreshing = true;

  window.location.reload();

});
</script>
