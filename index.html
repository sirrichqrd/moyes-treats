<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moye's Treats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a2c6a;
      --primary-light: #7c5c9c;
      --primary-dark: #3a1c5a;
      --accent: #f59e0b;
      --accent-light: #fbbf24;
      --bg: #f3e8ff;
      --bg-card: #ffffff;
      --border: #e9d5ff;
      --success: #10b981;
      --danger: #ef4444;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .font-pacifico { font-family: 'Pacifico', cursive; }
    .font-poppins { font-family: 'Poppins', sans-serif; }

    .bg-shape {
      position: fixed; border-radius: 50%; opacity: 0.12; z-index: 0; pointer-events: none;
    }
    .bg-shape-1 { width: 300px; height: 300px; background: var(--primary); top: -80px; right: -60px; }
    .bg-shape-2 { width: 220px; height: 220px; background: var(--accent); bottom: 80px; left: -60px; }
    .bg-shape-3 { width: 160px; height: 160px; background: var(--primary-light); top: 45%; right: 8%; }

    .cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: white;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.12); padding: 14px 20px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-bar.active { transform: translateY(0); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(31, 31, 46, 0.55);
      backdrop-filter: blur(10px); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: white; border-radius: 24px; width: 100%; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 25px 80px rgba(0,0,0,0.2);
      transform: scale(0.92) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-header { padding: 24px 28px 0; display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1.35rem; font-weight: 700; color: var(--primary-dark); font-family: 'Poppins', sans-serif; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg);
      color: var(--primary-dark); font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.25s;
    }
    .modal-close:hover { background: var(--border); transform: rotate(90deg); }
    .modal-body { padding: 20px 28px 28px; }

    .toast {
      position: fixed; top: 20px; right: 20px; background: white; padding: 14px 22px;
      border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 12px; z-index: 300;
      transform: translateX(150%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      border-left: 4px solid var(--success);
    }
    .toast.active { transform: translateX(0); }
    .toast-icon {
      width: 28px; height: 28px; background: var(--success); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0; font-size: 0.9rem;
    }

    .combo-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FAF5FF 100%);
      border: 2px solid var(--border); border-radius: 18px; padding: 22px;
      position: relative; transition: all 0.3s ease;
    }
    .combo-card:hover { border-color: var(--primary-light); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(91,46,145,0.1); }
    .combo-card.best-value {
      border-color: var(--accent);
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFBEB 100%);
    }
    .best-value-badge {
      position: absolute; top: -11px; right: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      padding: 5px 14px; border-radius: 20px; box-shadow: 0 4px 12px rgba(245,158,11,0.3); letter-spacing: 1px;
    }
    .item-qty {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; border-radius: 50%; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
    }

    .builder-card {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white; border: none; position: sticky; top: 80px;
    }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.15); color: white; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-weight: 600;
    }
    .qty-btn:hover { background: rgba(255,255,255,0.28); }

    .delivery-option {
      flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px;
      text-align: center; cursor: pointer; transition: all 0.3s;
    }
    .delivery-option.active {
      border-color: var(--primary); background: rgba(91,46,145,0.05);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px;
      font-family: 'Poppins', sans-serif; font-size: 0.95rem; transition: all 0.3s; background: white;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(124,79,184,0.1);
    }
    .form-textarea { resize: vertical; min-height: 80px; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .heart-anim { display: inline-block; animation: heartbeat 1.5s ease infinite; }

    .gal-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.85); hover:bg-white; rounded-full; w-8 h-8;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-bold; transition: all 0.2s; border: none; cursor: pointer;
    }
    .gal-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }

    .fee-line {
      display: flex; justify-content: space-between; padding: 6px 0;
      font-size: 0.9rem; color: #555;
    }
    .fee-line.total {
      border-top: 2px solid var(--primary-dark);
      padding-top: 10px; margin-top: 6px;
      font-weight: 700; color: var(--primary-dark); font-size: 1.05rem;
    }
    
    /* === PREVIEW GATE === */
#previewGate {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; font-family: 'Poppins', sans-serif;
}
#previewGate.hidden { display: none; }
.gate-card {
  background: white; border-radius: 24px; padding: 40px 32px;
  max-width: 420px; width: 100%; text-align: center;
  box-shadow: 0 25px 80px rgba(74,44,106,0.18);
  border: 1px solid #e9d5ff;
}
.gate-card h2 {
  font-family: 'Playfair Display', serif;
  color: #4a2c6a; font-size: 1.6rem; margin-bottom: 8px;
}
.gate-card p {
  color: #7c5c9c; font-size: 0.95rem; margin-bottom: 24px;
}
.gate-input {
  width: 100%; padding: 14px 18px; border: 2px solid #e9d5ff;
  border-radius: 14px; font-size: 1.1rem; text-align: center;
  letter-spacing: 4px; font-weight: 600; color: #4a2c6a;
  font-family: 'Poppins', sans-serif; transition: all 0.3s;
}
.gate-input:focus {
  outline: none; border-color: #7c5c9c;
  box-shadow: 0 0 0 4px rgba(124,79,184,0.12);
}
.gate-btn {
  width: 100%; margin-top: 16px; padding: 14px;
  border-radius: 14px; border: none;
  background: linear-gradient(135deg, #4a2c6a, #7c5c9c);
  color: white; font-weight: 700; font-size: 1rem;
  cursor: pointer; transition: all 0.25s;
  font-family: 'Poppins', sans-serif;
}
.gate-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(74,44,106,0.3);
}
.gate-error {
  color: #ef4444; font-size: 0.85rem; margin-top: 12px;
  font-weight: 500; display: none;
}
.gate-error.show { display: block; }

  </style>
</head>
<body class="bg-[#f3e8ff] min-h-screen">

    <button class="gate-btn" onclick="checkGateCode()">Continue</button>
    <div id="gateError" class="gate-error">Incorrect code. Please try again.</div>
  </div>
</div>

</div>

          </div>

        <div class="mb-4" id="addressGroup" style="display:none;">

function isAccessGranted() {
  try {
    const stored = localStorage.getItem('moyesPreviewAccess');
    if (!stored) return false;
    const data = JSON.parse(stored);
    const expiry = data.timestamp + (ACCESS_DURATION_HOURS * 60 * 60 * 1000);
    return Date.now() < expiry;
  } catch (e) { return false; }
}

function grantAccess() {
  try {
    localStorage.setItem('moyesPreviewAccess', JSON.stringify({ timestamp: Date.now() }));
  } catch (e) {}
  const gate = document.getElementById('previewGate');
  if (gate) gate.classList.add('hidden');
  render(); // render the main app
}

function checkGateCode() {
  const input = document.getElementById('gateCode');
  const error = document.getElementById('gateError');
  if (input.value.trim() === ACCESS_CODE) {
    error.classList.remove('show');
    grantAccess();
  } else {
    error.classList.add('show');
    input.value = '';
    input.focus();
  }
}

// ===================== UTILS =====================
function formatPrice(n) {
  return '₦' + n.toLocaleString('en-NG');
}
function getCartTotal() {
  return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
}
function getCartCount() {
  return cart.reduce((sum, item) => sum + item.qty, 0);
}
function getCustomSubtotal() {
  return cart
    .filter(item => item.type === 'custom')
    .reduce((sum, item) => sum + (item.price * item.qty), 0);
}
function getPackagingFee() {
  const customTotal = getCustomSubtotal();
  if (customTotal === 0) return 0;
  if (customTotal >= 1000 && customTotal <= 4999) return 600;
  if (customTotal >= 5000 && customTotal <= 9999) return 1000;
  if (customTotal >= 10000 && customTotal <= 14999) return 1200;
  if (customTotal >= 15000 && customTotal <= 20000) return 1500;
  if (customTotal > 20000 && customTotal <= 30000) return 2500;
  if (customTotal > 30000) return 2500;
  return 0;
}
function getDeliveryFee() {
  if (deliveryMethod !== 'delivery' || !selectedLocation) return 0;
  return deliveryFees[selectedLocation] || 0;
}
function getSubtotal() {
  return getCartTotal();
}
function getGrandTotal() {
  return getSubtotal() + getPackagingFee() + getDeliveryFee();
}
function hasCustomPackage() {
  return cart.some(item => item.type === 'custom');
}

// ===================== CART ACTIONS =====================
function addMenuItem(productId, itemName, price) {
  const existing = cart.find(i => i.type === 'menu' && i.productId === productId && i.itemName === itemName);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: Date.now() + Math.random(), type: 'menu', productId, itemName, price, qty: 1 });
  }
  updateCartUI();
  showToast('Added to Cart!', `${products[productId].name} — ${itemName}`);
}

function addCombo(name, price, items) {
  const existing = cart.find(i => i.type === 'combo' && i.name === name);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: Date.now() + Math.random(), type: 'combo', name, price, items, qty: 1 });
  }
  updateCartUI();
  showToast('Combo Added!', `${name} added to your order.`);
}

function addCustomToCart() {
  const hasItems = Object.values(customQty).some(q => q > 0);
  if (!hasItems) {
    showToast('Empty Package', 'Please select at least one item.', true);
    return;
  }
  let total = 0;
  let items = {};
  for (let [item, qty] of Object.entries(customQty)) {
    if (qty > 0) {
      items[item] = qty;
      total += qty * smallChopsPrices[item];
    }
  }
  cart.push({ id: Date.now() + Math.random(), type: 'custom', name: 'Custom Package', price: total, items, qty: 1 });
  for (let item in customQty) { customQty[item] = 0; }
  updateCartUI();
  showToast('Custom Package Added!', 'Your custom selection has been added.');
}

function updateCartQty(cartId, delta) {
  const item = cart.find(i => i.id === cartId);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== cartId);
  }
  updateCartUI();
  renderCartModal();
  renderCheckoutSummary();
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.id !== cartId);
  updateCartUI();
  renderCartModal();
  renderCheckoutSummary();
}

function updateCartUI() {
  const total = getGrandTotal();
  const count = getCartCount();
  document.getElementById('cartBarTotal').textContent = formatPrice(total);
  document.getElementById('cartBar').classList.toggle('active', count > 0);
  const badge = document.getElementById('navCartBadge');
  if (badge) badge.textContent = count;
}

  const toast = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastMessage').textContent = message;
  const icon = document.getElementById('toastIcon');
  icon.textContent = isError ? '!' : '✓';
  icon.style.background = isError ? 'var(--danger)' : 'var(--success)';
  toast.style.borderLeftColor = isError ? 'var(--danger)' : 'var(--success)';

}

function submitOrder(e) {
  e.preventDefault();
  if (cart.length === 0) {
    showToast('Empty Cart', 'Please add items to your order first.', true);
    return;
  }

  const form = e.target;
  const firstName = form.firstName.value;
  const lastName = form.lastName.value;
  const phone = form.phone.value;
  const houseNumber = form.houseNumber.value;
  const street = form.street.value;
  const landmark = form.landmark.value;
  const notes = form.notes.value;

  // Save customer details to localStorage
  savedCustomer = { firstName, lastName, phone, houseNumber, street, landmark, notes };
  try {
    localStorage.setItem('moyesCustomer', JSON.stringify(savedCustomer));
  } catch(err) {}

  const subtotal = getSubtotal();
  const packagingFee = getPackagingFee();
  const deliveryFee = getDeliveryFee();
  const grandTotal = getGrandTotal();

  let msg = `*NEW ORDER — Moye's Treats*%0A%0A`;
  msg += `*Customer:* ${firstName} ${lastName}%0A`;
  msg += `*Phone:* ${phone}%0A`;
  msg += `*Delivery:* ${deliveryMethod === 'pickup' ? 'Pickup' : 'Delivery'}%0A`;
  if (deliveryMethod === 'delivery') {
    if (selectedLocation) msg += `*Location:* ${selectedLocation}%0A`;
    if (houseNumber) msg += `*House Number:* ${houseNumber}%0A`;
    if (street) msg += `*Street:* ${street}%0A`;
    if (landmark) msg += `*Nearest Landmark:* ${landmark}%0A`;
  }
  if (notes) msg += `*Notes:* ${notes}%0A`;
  msg += `%0A*ORDER ITEMS:*%0A`;

  cart.forEach((item, i) => {
    let line = '';
    if (item.type === 'menu') {
      line = `${products[item.productId].name} — ${item.itemName}`;
    } else if (item.type === 'combo') {
      line = `${item.name} (${Object.entries(item.items).map(([n,q])=>`${q} ${n}`).join(', ')})`;
    } else {
      line = `${item.name} (${Object.entries(item.items).map(([n,q])=>`${q}× ${n}`).join(', ')})`;
    }
    msg += `${i+1}. ${line} ×${item.qty} — ${formatPrice(item.price * item.qty)}%0A`;
  });

  msg += `%0A*ORDER TOTAL:*%0A`;
  msg += `Subtotal: ${formatPrice(subtotal)}%0A`;
  if (packagingFee > 0) msg += `Packaging Fee: ${formatPrice(packagingFee)}%0A`;
  if (deliveryFee > 0) msg += `Delivery Fee: ${formatPrice(deliveryFee)}%0A`;
  msg += `*GRAND TOTAL: ${formatPrice(grandTotal)}*`;

  const whatsappUrl = `https://wa.me/234${contact.phone}?text=${msg}`;
  window.open(whatsappUrl, '_blank');
  showToast('Order Ready!', 'Redirecting you to WhatsApp...');
}

          const imgCount = cat.images.length;

            <div class="bg-white rounded-2xl overflow-hidden shadow-lg border border-purple-100 hover:shadow-xl transition-all">
              <div class="relative h-52 bg-gray-100 overflow-hidden group">
                <img src="${cat.images[imgIdx]}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="${cat.name}">
                ${imgCount > 1 ? `
                  <div class="absolute top-2 right-2 bg-black/50 text-white text-xs px-2 py-1 rounded-full backdrop-blur-sm">${imgIdx+1}/${imgCount}</div>
                  <button onclick="prevGalleryImage('${cat.id}', ${imgCount})" class="gal-btn left-2">‹</button>
                  <button onclick="nextGalleryImage('${cat.id}', ${imgCount})" class="gal-btn right-2">›</button>
                ` : ''}
              </div>
              <div class="p-5">
                <h3 class="text-xl font-bold text-[#4a2c6a] mb-2">${cat.name} ${cat.subtitle ? `<span class="text-sm font-normal text-gray-500">${cat.subtitle}</span>` : ''}</h3>
                <p class="text-gray-600 text-sm mb-4 leading-relaxed">${cat.desc}</p>
                <div class="flex items-center justify-between">
                  <span class="text-amber-600 font-bold">from ${formatPrice(cat.fromPrice)}</span>
                  <button onclick="setPage('menu')" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition-all">See prices</button>
                </div>
              </div>
            </div>`;
        }).join('')}
      </div>
      <div class="text-center mt-8 text-[#7c5c9c] text-sm">
        Moye's Treats · ${contact.location} · ${contact.displayPhone}
      </div>
    </div>`;
}

// ===================== MENU =====================
function renderMenu() {
  const categories = Object.values(products).filter(p => p.id !== 'smallChops');
  return `
    <div class="min-h-screen bg-gradient-to-b from-[#f3e8ff] to-[#e9d5ff] pb-20">
      ${renderNav()}
      <div class="text-center pt-10 pb-6 px-4">
        <h1 class="text-4xl font-bold text-[#4a2c6a] mb-3">Our Menu</h1>
        <span class="bg-[#4a2c6a] text-white px-6 py-2 rounded-full text-sm font-semibold tracking-wider">PRICE LIST</span>
      </div>
      <div class="max-w-3xl mx-auto px-4 space-y-6">
        ${categories.map(cat => `
          <div class="bg-white/90 backdrop-blur rounded-3xl p-6 shadow-lg border border-purple-100">
            <div class="flex items-center gap-3 mb-4 pb-3 border-b border-dashed border-purple-200">
              <span class="text-2xl">${cat.icon}</span>
              <div>
                <h2 class="text-2xl font-bold text-[#4a2c6a]">${cat.name} ${cat.subtitle ? `<span class="text-sm font-normal text-gray-500">${cat.subtitle}</span>` : ''}</h2>
              </div>
            </div>
            <div class="space-y-3">
              ${cat.items.map(item => {
                const cartItem = cart.find(i => i.type === 'menu' && i.productId === cat.id && i.itemName === item.name);
                return `
                  <div class="flex items-center justify-between py-2 border-b border-dashed border-purple-100 last:border-0">
                    <div class="min-w-0 pr-2">
                      <span class="font-semibold text-[#4a2c6a] text-sm">${item.name}</span>
                      ${cartItem ? `<span class="ml-2 text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">${cartItem.qty} in cart</span>` : ''}
                    </div>
                    <div class="flex items-center gap-3 shrink-0">
                      <span class="text-amber-600 font-bold text-sm">${formatPrice(item.price)}</span>
                      <button onclick="addMenuItem('${cat.id}', '${item.name}', ${item.price})"
                        class="w-9 h-9 rounded-full bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center font-bold text-lg shadow-lg shadow-amber-500/30 transition-all hover:scale-110">
                        +
                      </button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
            ${cat.note ? `<p class="mt-3 text-sm text-purple-600 italic">${cat.note}</p>` : ''}
          </div>
        `).join('')}
        <div class="bg-gradient-to-r from-[#4a2c6a] to-[#7c5c9c] rounded-3xl p-6 text-white text-center shadow-lg">
          <p class="text-sm opacity-90 mb-2">Craving something savoury?</p>
          <button onclick="setPage('smallchops')" class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-2.5 rounded-full font-semibold text-sm transition-all shadow-lg">
            Check out our Small Chops →
          </button>
        </div>
      </div>
      <div class="text-center mt-8 text-[#7c5c9c] text-sm">
        Moye's Treats · ${contact.location} · ${contact.displayPhone}
      </div>
    </div>`;
}

// ===================== SMALL CHOPS =====================
function renderSmallChops() {
  setTimeout(() => {
    for (let item in customQty) {
      const el = document.getElementById('qty-' + item.replace(/\s/g, '-'));
      if (el) el.textContent = customQty[item];
    }
  }, 0);

  return `
    <div class="min-h-screen bg-gradient-to-b from-[#f3e8ff] to-[#e9d5ff] pb-24 font-poppins">
      ${renderNav()}
      <header class="text-center pt-10 pb-6 px-4">
        <div class="text-xs tracking-[0.25em] uppercase text-[#7c5c9c] font-semibold mb-2">Freshly Made · Party Favourites</div>
        <h1 class="text-4xl sm:text-5xl text-[#4a2c6a] mb-2 font-pacifico">Small Chops</h1>
        <div class="inline-flex items-center gap-3 text-[#5a3a7a] italic">
          <span class="w-8 h-px bg-amber-500"></span>
          <span>Price List & Combo Packages</span>
          <span class="w-8 h-px bg-amber-500"></span>
        </div>
      </header>

      <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Left: Combos -->
        <div>
          <div class="flex items-center gap-3 mb-6">
            <div class="w-9 h-9 bg-gradient-to-br from-[#4a2c6a] to-[#7c5c9c] rounded-xl flex items-center justify-center text-white text-lg shadow-md">📦</div>
            <h2 class="text-xl font-bold text-[#4a2c6a]">Combo Packages</h2>
          </div>
          <div class="space-y-5">
            ${combos.map(combo => `
              <div class="combo-card ${combo.bestValue ? 'best-value' : ''}">
                ${combo.bestValue ? '<div class="best-value-badge">Best Value</div>' : ''}
                <div class="flex justify-between items-start mb-4 pb-3 border-b-2 border-dashed border-purple-200">
                  <div class="font-bold text-[#4a2c6a] tracking-wide uppercase text-sm">${combo.name}</div>
                  <div class="text-2xl font-extrabold text-[#4a2c6a]"><span class="text-sm font-semibold">₦</span>${combo.price.toLocaleString()}</div>
                </div>
                <ul class="space-y-2 mb-5">
                  ${Object.entries(combo.items).map(([name, qty]) => `
                    <li class="flex items-center gap-3 text-sm text-gray-700">
                      <span class="item-qty">${qty}</span> ${name}
                    </li>
                  `).join('')}
                </ul>
                <button onclick="addCombo('${combo.name}', ${combo.price}, ${JSON.stringify(combo.items).replace(/"/g, '&quot;')})"
                  class="w-full py-3 rounded-xl ${combo.bestValue ? 'bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-600 hover:to-amber-500' : 'bg-gradient-to-r from-[#4a2c6a] to-[#7c5c9c] hover:from-[#3a1c5a] hover:to-[#6c4c8c]'} text-white font-semibold shadow-lg transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2">
                  <span>+</span> Add to Order
                </button>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Right: Custom Builder -->
        <div>
          <div class="card builder-card rounded-3xl p-6 shadow-xl">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-8 h-8 bg-white/15 rounded-full flex items-center justify-center text-white text-sm">⚡</div>
              <h2 class="text-lg font-bold text-white">Customize Your Package</h2>
            </div>
            <p class="text-sm text-white/70 mb-4">Build your own — pick any quantity you like!</p>

            <div class="bg-white/10 rounded-xl p-3 mb-5 text-xs text-white/80 leading-relaxed">
              📦 <strong>Packaging Fee:</strong> Custom packages require special packaging. The packaging fee is calculated automatically based on your order total and will be added at checkout.
            </div>

            <div class="space-y-1">
              ${Object.entries(smallChopsPrices).map(([item, price]) => `
                <div class="flex items-center justify-between py-3.5 border-b border-dashed border-white/15 last:border-0">
                  <div class="flex-1">
                    <div class="flex items-center gap-3 mb-1">
                      <span class="text-xl">${item === 'Samosa' ? '🔺' : item === 'Spring Roll' ? '🟡' : item === 'Puff Puff' ? '💛' : item === 'Beef' ? '🥩' : '🍗'}</span>
                      <span class="font-medium text-white">${item}</span>
                    </div>
                    <div class="flex items-center gap-2 ml-10">
                      <button class="qty-btn" onclick="updateQty('${item}', -1)">−</button>
                      <span class="font-bold text-white w-5 text-center" id="qty-${item.replace(/\s/g, '-')}">0</span>
                      <button class="qty-btn" onclick="updateQty('${item}', 1)">+</button>
                    </div>
                  </div>
                  <div class="text-amber-300 font-bold text-sm bg-white/10 px-3 py-1 rounded-full">₦${price.toLocaleString()}</div>
                </div>
              `).join('')}
            </div>

            <button onclick="addCustomToCart()" class="w-full mt-5 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-600 hover:to-amber-500 text-white font-semibold shadow-lg transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2">
              <span>+</span> Add Custom Package
            </button>
          </div>
        </div>
      </div>

      <footer class="text-center mt-12 text-[#7c5c9c] text-sm pb-4">
        <p>Place your order today <span class="heart-anim text-amber-500">♥</span> Freshly fried, perfectly spiced</p>
      </footer>
    </div>`;
}

// ===================== RENDER =====================
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  switch (currentPage) {
    case 'home': app.innerHTML = renderHome(); break;
    case 'gallery': app.innerHTML = renderGallery(); break;
    case 'menu': app.innerHTML = renderMenu(); break;
    case 'smallchops': app.innerHTML = renderSmallChops(); break;
    default: app.innerHTML = renderHome();
  }
  updateCartUI();
}

document.addEventListener('DOMContentLoaded', function() {
  if (isAccessGranted()) {
    grantAccess();
  }
  // If not granted, the gate stays visible and render() is NOT called yet
});

</script>
</body>
</html>
